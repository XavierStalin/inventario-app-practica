# ==========================================
# RETO 2: Pods en estado Running, servicio sin respuesta
# ==========================================
# INSTRUCCIONES:
#   1. Aplique: kubectl apply -f deployment-roto.yaml
#   2. Verifique pods: kubectl get pods (aparecen Running)
#   3. Intente acceder vía Service: No hay respuesta
#   4. Diagnostique con:
#      kubectl describe service inventario-service
#      kubectl get endpoints inventario-service
#   5. Corrija el manifiesto
# ==========================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventario-app
  labels:
    app: inventario-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp          # <-- El selector busca "webapp"
  template:
    metadata:
      labels:
        app: webapp     # <-- DEFECTO: Los pods tienen label "web" (no "webapp")
    spec:
      containers:
      - name: inventario-app
        image: ghcr.io/xavierstalin/inventario-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: APP_VERSION
          value: "v1.0.0"
        - name: APP_COLOR
          value: "blue"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 12
          periodSeconds: 5

---

apiVersion: v1
kind: Service
metadata:
  name: inventario-service
spec:
  type: ClusterIP
  selector:
    app: webapp            # <-- El Service busca "webapp", pero los pods tienen "web"
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
